# Validacao de todo PR e de push na main/develop, em ambiente limpo (Windows, onde roda a interface;
# e Linux, para os scripts da esteira, que e onde eles rodam de verdade nas Actions). O job "check" e o gate obrigatorio.
name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Instalar o pacote
        run: pip install -e .
      - name: Sintaxe
        run: python -m compileall -q src scripts tests
      - name: Testes
        run: python -m unittest discover -s tests -v

  # Garante a promessa do README (Python 3.10 ou superior). Nao e gate obrigatorio.
  compat:
    name: compat (Python ${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Instalar o pacote
        run: pip install -e .
      - name: Testes
        run: python -m unittest discover -s tests -v

  # build-release.yml só roda em branches release/**, nunca em PR -- sem isso, um erro no Inno
  # Setup só apareceria na integração final da release, tarde demais. Nao e gate obrigatorio
  # (é lento: compila de verdade + Inno Setup), mas roda em todo PR que mexe em packaging/windows/.
  instalador:
    name: instalador (Inno Setup)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements-build.txt
      # Sem isso, o PyInstaller só avisa (não falha) que pywin32/pystray/Pillow não foram
      # encontrados e gera um .exe faltando módulos -- quebra só em tempo de execução, não
      # aqui. Achado ao vivo (tarefa #24: ModuleNotFoundError: win32timezone escapou deste
      # job exatamente por essa razão).
      - run: pip install -e .
      - name: Instalar o Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Compilar e empacotar o instalador
        run: python packaging/windows/build_installer.py --saida build-local
      - name: Conferir que o instalador foi gerado
        shell: bash
        run: |
          ls -la build-local/
          test -f build-local/SHA256SUMS.txt
          (cd build-local && sha256sum -c SHA256SUMS.txt)

  # Testes dos scripts do processo (bash + git) no Linux, onde eles de fato rodam nas Actions.
  scripts:
    name: scripts (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Testes dos scripts
        working-directory: tests
        run: python -m unittest -v test_pr_regras test_conferir_release test_tarefas_do_epico test_slug test_mesclar test_sem_executavel test_promover_release test_publicar_producao test_atualizar_release test_build_exe test_projeto_sprint test_muda_programa test_iniciar_sprint test_criar_branches test_integrar_release test_apagar_release test_encerrar_sprint test_versao

  # Estilo e qualidade do codigo com o Ruff, nas regras do pyproject.toml ([tool.ruff]).
  lint:
    name: lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install "ruff>=0.6,<1"
      - name: Ruff
        run: ruff check . --output-format=github
