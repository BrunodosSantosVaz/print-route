# "Integrar release": quando TODOS os PRs de um milestone estao aprovados (label "aprovado") e com a
# CI verde, cria release/x.y.z, mescla as features uma por uma, atualiza versao e CHANGELOG e envia a
# branch (o que dispara a release candidata). Roda sozinho quando um PR recebe a label "aprovado"
# (se ainda faltam PRs, so avisa) e tambem por botao:
#   gh workflow run integrar-release.yml -f versao=v0.6.0 -f simular=false
# Os scripts vem da branch de destino do PR (nao do PR), como no kanban. O push usa o PROJETO_TOKEN
# para disparar os workflows seguintes.
name: Integrar release

on:
  workflow_dispatch:
    inputs:
      versao:
        description: 'Versao (ex.: v0.6.0): o milestone com esse nome'
        required: true
        type: string
      simular:
        description: 'Somente mostrar o que seria feito'
        required: true
        type: boolean
        default: true
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: integrar-release
  cancel-in-progress: false

jobs:
  integrar:
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
      || (github.event.label.name == 'aprovado'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.event.pull_request.base.ref == (vars.BRANCH_DEVELOP || 'develop')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          token: ${{ secrets.PROJETO_TOKEN }}
      - name: Integrar
        run: bash .github/scripts/integrar-release.sh
        env:
          GH_TOKEN: ${{ secrets.PROJETO_TOKEN }}
          VERSAO: ${{ inputs.versao }}
          SIMULAR: ${{ inputs.simular || 'false' }}
          AUTO: ${{ github.event_name == 'pull_request' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PROJETO_OWNER: ${{ vars.PROJETO_OWNER }}
          PROJETO_EXECUCAO: ${{ vars.PROJETO_EXECUCAO }}
          PROJETO_BUGS: ${{ vars.PROJETO_BUGS }}
          BRANCH_DEVELOP: ${{ vars.BRANCH_DEVELOP || 'develop' }}
